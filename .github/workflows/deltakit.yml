name: Optional Deltakit backend
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/tqec/**'
      - 'tests/compile/lowering/deltakit/**'
      - 'requirements/deltakit-test.txt'
      - '.github/workflows/deltakit.yml'
jobs:
  native-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --group test --python ${{ matrix.python-version }}
      - run: uv pip install -r requirements/deltakit-test.txt
      - name: Native API and dependency isolation
        run: .venv/bin/python -m pytest tests/compile/lowering/deltakit/api_smoke_test.py tests/compile/lowering/deltakit/contracts_test.py
      - name: Memory and local RPNG
        run: |
          .venv/bin/python -m pytest tests/compile/lowering/deltakit/integration_test.py -k 'memory and bulk and 1'
          .venv/bin/python -m pytest tests/compile/lowering/deltakit/constructions_test.py -k rpng
